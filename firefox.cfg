// Start of Firefox Config rules
//https://searchfox.org/mozilla-release/source/browser/base/content/browser-sets.inc

var Services = globalThis.Services;
Services.console.logStringMessage("config.js script loaded");
if (Services.appinfo.inSafeMode == false) {
  Services.obs.addObserver(function (aSubject, aTopic, aData) {
    var chromeWindow = aSubject;
	  /*
		As of FireFox 134, window.g_Browser no longer works.
		Replaced gBrowser with DomContent Loaded:  (Credit:  https://forums.mozillazine.org/viewtopic.php?t=3126988)
	  */
    chromeWindow.addEventListener("load", function (aEvent) {
      var doc = aEvent.target;
      var url = doc.location.href;
	  
      if (url == "chrome://browser/content/browser.xhtml") {
        chromeWindow.setTimeout(function () {
          try {
            var key = chromeWindow.document.getElementById("manBookmarkKb");
            key.setAttribute("oncommand", "BookmarkingUI.toggleBookmarksToolbar('shortcut');");
            key.removeAttribute("command");
            var key2 = chromeWindow.document.getElementById("viewBookmarksToolbarKb");
            key2.setAttribute("command", "Browser:ShowAllBookmarks");
			
	    var mozilla = chromeWindow.document.getElementById('key_undoCloseWindow');
	    mozilla.setAttribute( "oncommand", "" );
	    mozilla.removeAttribute("command");
	    var arse = chromeWindow.document.getElementById('key_undoCloseWindow');
	    arse.setAttribute( "command", "Tools:PrivateBrowsing" );
	    arse.removeAttribute("oncommand");
          } catch (aError) {
            Components.utils.reportError(aError);
          }
        }, 10);
      }
    }, false);
  }, "chrome-document-global-created", false);
}
